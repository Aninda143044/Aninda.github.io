  <rect x="40" y="30" width="520" height="34" rx="10" fill="#1e293b" />
  <circle cx="65" cy="47" r="5" fill="#ef4444" />
  <circle cx="85" cy="47" r="5" fill="#f59e0b" />
  <circle cx="105" cy="47" r="5" fill="#10b981" />
  <text x="300" y="52" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">aninda@conformist101: ~/agentblindfold</text>

  <!-- Terminal Output -->
  <text x="65" y="95" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13">$ cargo build --release</text>
  <text x="65" y="120" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">   Compiling</text>
  <text x="145" y="120" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">agentblindfold-core v0.4.2</text>
  <text x="65" y="142" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">   Compiling</text>
  <text x="145" y="142" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">secrets-redactor v0.2.1</text>
  <text x="65" y="164" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">    Finished</text>
  <text x="145" y="164" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">release [optimized] target(s) in 3.42s</text>

  <text x="65" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13">$ agentblindfold run --target claude-code</text>
  <text x="65" y="225" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">[AgentBlindfold]</text>
  <text x="195" y="225" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">Sandbox activated: 24 sensitive env variables scrubbed.</text>
