<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#4c1d95" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="270" fill="url(#sky)" />
  <rect y="270" width="600" height="130" fill="url(#river)" />

  <!-- Distant City Silhouette -->
  <rect x="20" y="230" width="40" height="40" fill="#1e1b4b" />
  <rect x="70" y="210" width="30" height="60" fill="#1e1b4b" />
  <polygon points="120,210 135,180 150,210" fill="#1e1b4b" />
  <rect x="125" y="210" width="20" height="60" fill="#1e1b4b" />
  <rect x="480" y="220" width="35" height="50" fill="#1e1b4b" />
  <rect x="525" y="200" width="45" height="70" fill="#1e1b4b" />

  <!-- Iconic Howrah Bridge Cantilever Silhouette -->
  <!-- Left Pylon Tower -->
  <polygon points="180,100 195,100 205,270 170,270" fill="#0f172a" />
  <!-- Right Pylon Tower -->
  <polygon points="395,100 410,100 420,270 385,270" fill="#0f172a" />
  <!-- Upper Arch Truss Span -->
  <path d="M 185 100 Q 295 140 405 100" stroke="#0f172a" stroke-width="8" fill="none" />
  <!-- Lower Road Deck -->
  <line x1="100" y1="250" x2="490" y2="250" stroke="#0f172a" stroke-width="8" />
  <!-- Cantilever Cross Trusses -->
  <line x1="185" y1="100" x2="240" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="240" y1="115" x2="195" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="240" y1="115" x2="295" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="295" y1="125" x2="240" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="295" y1="125" x2="350" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="350" y1="115" x2="295" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="350" y1="115" x2="405" y2="250" stroke="#0f172a" stroke-width="2.5" />
  <line x1="405" y1="100" x2="350" y2="250" stroke="#0f172a" stroke-width="2.5" />

  <!-- River Lights & Water Shimmer -->
  <line x1="170" y1="280" x2="420" y2="280" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" stroke-dasharray="10 15" />
  <line x1="200" y1="300" x2="390" y2="300" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-dasharray="20 20" />
  <line x1="230" y1="325" x2="360" y2="325" stroke="#f59e0b" stroke-width="1" opacity="0.3" stroke-dasharray="30 25" />

  <!-- Traditional Wooden Boat in Hooghly River -->
  <ellipse cx="440" cy="315" rx="26" ry="6" fill="#090d16" />
  <polygon points="432,315 440,295 448,315" fill="#090d16" />

  <text x="300" y="375" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Kolkata Sunset on the Hooghly: The City of Joy &amp; Curiosity</text>
</svg>
